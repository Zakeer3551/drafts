name: nodejs-feature-branch-workflow
on: 
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string
env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
  acc_id: 160885265516

jobs:
  # Job name
  trigger:
    runs-on: self-hosted # Github hosted runners
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: read package.json version
        id: package_version
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: check app version
        run: echo "$APP_VERSION"

      - name: install dependencies
        run: npm install

      - name: unit tests
        id: unit_tests
        run: npm test

      - name: Update Unit_tests
        uses: drafts/workflows/.github/actions/update-commit-status@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          context: unit-tests
          state: ${{ steps.unit_tests.outcome }}
          description: Unit tests ${{ steps.unit_tests.outcome }}
